version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anvldevin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build: ./api
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/anvldevin?schema=public
      JWT_SECRET: connected-worker-jwt-secret-dev
      JWT_REFRESH_SECRET: connected-worker-refresh-secret-dev
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@connected-worker.local
      UPLOAD_DIR: /app/uploads
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  ui:
    build: ./ui
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
