name: CI

on:
  push:
    branches: [anvl/mvp-v1, main]
  pull_request:
    branches: [main]

jobs:
  api-lint-build:
    name: API – Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run lint
      - run: npm run build

  ui-lint-build:
    name: UI – Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api-lint-build, ui-lint-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
